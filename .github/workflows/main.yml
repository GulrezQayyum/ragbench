name: Deploy to Hugging Face

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          rm -rf .git

          git init
          git branch -m main
          git add .
          git commit -m "Deploy clean state to Hugging Face"

          git remote add huggingface "https://Gul55555:${HF_TOKEN}@huggingface.co/spaces/Gul55555/ragbench"
          git push huggingface main --force
